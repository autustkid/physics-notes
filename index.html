<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="t-ink" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto" markerUnits="strokeWidth"><path d="M0,.6 L9,5 L0,9.4 L2.2,5 z" class="m-ink"/></marker>
  <marker id="t-red" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto" markerUnits="strokeWidth"><path d="M0,.6 L9,5 L0,9.4 L2.2,5 z" class="m-red"/></marker>
  <marker id="t-blue" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto" markerUnits="strokeWidth"><path d="M0,.6 L9,5 L0,9.4 L2.2,5 z" class="m-blue"/></marker>
  <marker id="t-amber" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto" markerUnits="strokeWidth"><path d="M0,.6 L9,5 L0,9.4 L2.2,5 z" class="m-amber"/></marker>
  <marker id="t-mut" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto" markerUnits="strokeWidth"><path d="M0,.6 L9,5 L0,9.4 L2.2,5 z" class="m-mut"/></marker>
  <marker id="t-green" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="6.2" markerHeight="6.2" orient="auto" markerUnits="strokeWidth"><path d="M0,.6 L9,5 L0,9.4 L2.2,5 z" class="m-green"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="6" class="h-l" stroke-width="1.2"/>
  </pattern>
</defs></svg>

<div class="top">
  <div class="bar">
    <a href="#/" class="brand">Физика</a>
    <div class="right">
      <span class="sec" id="topSection"></span>
      <button class="tbtn" id="themeBtn" aria-label="Тема">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.4"/><path d="M12 1.8v2.4M12 19.8v2.4M4 4l1.7 1.7M18.3 18.3L20 20M1.8 12h2.4M19.8 12h2.4M4 20l1.7-1.7M18.3 5.7L20 4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.3A8.6 8.6 0 1 1 9.7 3.5a6.9 6.9 0 0 0 10.8 10.8z"/></svg>
      </button>
    </div>
  </div>
  <div class="prog"><i id="prog"></i></div>
</div>

<main id="app"></main>
